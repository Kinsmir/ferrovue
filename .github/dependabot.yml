version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      vue:
        patterns: ["vue", "@vue/*", "vue-router", "pinia", "vue-i18n", "@intlify/*", "@unhead/vue"]
      tooling:
        patterns: ["*"]
        exclude-patterns: ["vue", "@vue/*", "vue-router", "pinia", "vue-i18n", "@intlify/*", "@unhead/vue"]
    ignore:
      - dependency-name: "@babel/parser"
        update-types: ["version-update:semver-major"]
