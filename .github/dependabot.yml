version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directories: ["/", "/packages/ferrovue"]
    schedule:
      interval: weekly
    groups:
      vue:
        patterns: ["vue", "@vue/*", "vue-router", "pinia"]
      tooling:
        patterns: ["*"]
        exclude-patterns: ["vue", "@vue/*", "vue-router", "pinia"]
