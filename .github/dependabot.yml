version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]

  # The root covers every pnpm workspace member and the catalog in pnpm-workspace.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Vue and the peers the conformance fixtures are recorded against: one pull request, so the
      # recordings move together.
      vue:
        patterns: ["vue", "@vue/*", "vue-router", "pinia", "vue-i18n", "@intlify/*", "@unhead/vue"]
      tooling:
        patterns: ["*"]
        exclude-patterns: ["vue", "@vue/*", "vue-router", "pinia", "vue-i18n", "@intlify/*", "@unhead/vue"]
    ignore:
      # ferrovue reads the ASTs @vue/compiler-sfc parses with Babel 7 beside the ones it parses
      # itself, so both must be Babel 7: Babel 8 changes the shape of type annotations. Move to 8
      # in the pull request that moves Vue to a compiler-sfc on Babel 8.
      - dependency-name: "@babel/parser"
        update-types: ["version-update:semver-major"]
