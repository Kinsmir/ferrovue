version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directories: ["/", "/packages/ferrovue"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      vue:
        patterns: ["vue", "@vue/*", "vue-router", "pinia"]
      tooling:
        patterns: ["*"]
        exclude-patterns: ["vue", "@vue/*", "vue-router", "pinia"]
