name: Rust
description: Installs a Rust toolchain and restores the cargo cache saved under a shared key
inputs:
  toolchain:
    description: The toolchain to install
    default: stable
  components:
    description: Components to add, comma separated
    default: ""
  cache-key:
    description: The shared key of the cargo cache
    required: true
  save:
    description: Save the cache at the end of the job, by default on main only
    default: ${{ github.ref == 'refs/heads/main' }}
  cache:
    description: Restore the cargo cache at all; "false" for a job that publishes what it builds
    default: "true"
runs:
  using: composite
  steps:
    - id: toolchain
      uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
    - name: Use that toolchain in the workspace, over rust-toolchain.toml's
      shell: bash
      env:
        TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
      run: rustup override set "$TOOLCHAIN" --path "$GITHUB_WORKSPACE"
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      if: inputs.cache == 'true'
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save }}
