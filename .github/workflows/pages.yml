name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "README.md"
      - "CHANGELOG.md"
      - "crates/ferrovue/docs/**"
      - "crates/*/src/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "README.md"
      - "CHANGELOG.md"
      - "crates/ferrovue/docs/**"
      - "crates/*/src/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/pnpm
      - run: pnpm --filter ferrovue-site build
      - name: The site has every guide page, the sitemap and robots.txt
        run: |
          for page in crates/ferrovue/docs/guide/*.md; do
            name=$(basename "$page" .md)
            test -f "site/.vitepress/dist/guide/${name//_/-}.html"
          done
          test -f site/.vitepress/dist/sitemap.xml
          test -f site/.vitepress/dist/robots.txt
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
