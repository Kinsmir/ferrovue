name: Release

# Pushing a tag `v1.2.3` (or `v1.2.3-rc.1`) releases that version of the npm package and of every
# crate (`node scripts/release.ts crates` lists them, in the order they are published):
#
#   verify ─┬─ npm: staged on npm, public once a maintainer runs `npm stage approve` with 2FA
#   ci     ─┴─ crates.io: published once a maintainer approves the `release` environment
#                └─ GitHub release, with the changelog notes and every package attached
#
# No long-lived token is stored: both registries trust this workflow through GitHub's OIDC token.
# One-time setup is described in RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: The tag matches the repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Tag, manifests and changelog agree
        run: node scripts/release.ts check "$GITHUB_REF_NAME"
      # Only a signed, annotated tag starts a release: GitHub must have verified its signature against
      # a key on the tagger's account. A lightweight tag, or an unsigned or unverified one, stops the
      # release here, before anything is staged or published.
      - name: The tag is signed and GitHub verifies its signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          if [[ "$(jq -r .object.type <<<"$ref")" != tag ]]; then
            echo "::error title=Unsigned release tag::$GITHUB_REF_NAME is a lightweight tag. Delete it and push a signed one: git tag -s $GITHUB_REF_NAME -m \"ferrovue ${GITHUB_REF_NAME#v}\""
            exit 1
          fi
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")")
          if [[ "$(jq -r .verification.verified <<<"$tag")" != true ]]; then
            echo "::error title=Unsigned release tag::$GITHUB_REF_NAME is not signed, or GitHub cannot verify its signature ($(jq -r .verification.reason <<<"$tag")). Sign it with a key added to your GitHub account as a signing key: git tag -s $GITHUB_REF_NAME"
            exit 1
          fi
          echo "$GITHUB_REF_NAME is signed by $(jq -r .tagger.name <<<"$tag"), verified by GitHub"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-semver-checks
      # Each crate's public API against its newest version on crates.io not newer than this one,
      # with the kind of release read from the two versions as Cargo reads them: 0.1.x to 0.2.0 may
      # break the API, 0.2.0 to 0.2.1 may only add to it, and 1.x to 2.0 may break it. A crate not
      # yet on crates.io has nothing to be compared with. cargo-semver-checks does not follow a
      # re-export from another crate, so what `ferrovue` re-exports is checked in the crate that
      # defines it.
      - name: Each crate's API changes are allowed by its version (cargo-semver-checks)
        run: |
          for crate in $(node scripts/release.ts crates); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "ferrovue release workflow (github.com/Kinsmir/ferrovue)" "https://crates.io/api/v1/crates/$crate")
            if [[ "$status" == 404 ]]; then
              echo "::notice title=$crate is new::$crate is not on crates.io yet, so its API has nothing to be compared with"
              continue
            fi
            cargo semver-checks -p "$crate"
          done
      - id: version
        name: The version, and whether it is a pre-release
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  npm:
    name: Stage on npm
    needs: [verify, ci]
    runs-on: ubuntu-latest
    outputs:
      approve: ${{ steps.stage.outputs.approve }}
    permissions:
      contents: read
      id-token: write # npm trusted publishing, and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Staged publishing arrived in npm 12.
      - run: npm install -g npm@^12
      - run: pnpm install --frozen-lockfile
      - name: Stage the package, unless this version is already on npm
        id: stage
        working-directory: packages/ferrovue
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: |
          if npm view "ferrovue@$VERSION" version >/dev/null 2>&1; then
            echo "ferrovue@$VERSION is already on npm"
            exit 0
          fi
          # `prepack` builds dist/ and copies the README and licences in.
          npm stage publish --provenance --access public --tag "$TAG" --json | tee "$RUNNER_TEMP/stage.json"
          # The stage's id, if npm's JSON names one; otherwise `npm stage list` shows it.
          id=$(node -e '
            const out = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const find = (v) => v && typeof v === "object" ? (v.stageId ?? v.stage_id ?? v.id ?? Object.values(v).map(find).find(Boolean)) : undefined;
            console.log(find(out) ?? "");
          ' "$RUNNER_TEMP/stage.json" 2>/dev/null || true)
          if [[ -n "$id" ]]; then
            approve="npm stage approve $id"
          else
            approve="npm stage list ferrovue   # then: npm stage approve <id>"
          fi
          # A notice shows at the top of the run's page, where a maintainer looks first.
          echo "::notice title=npm: ferrovue@$VERSION is staged, not yet public::Approve it with 2FA: $approve"
          {
            echo "### npm: ferrovue@$VERSION is staged, not yet public"
            echo
            echo "It goes public under \`$TAG\` once a maintainer approves it with 2FA:"
            echo
            echo '```sh'
            echo "$approve"
            echo '```'
            echo
            echo "\`npm stage reject\` with the same id discards it instead."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "approve=$approve" >> "$GITHUB_OUTPUT"

  crates:
    name: Publish on crates.io
    needs: [verify, ci]
    runs-on: ubuntu-latest
    # Waits here for a maintainer's approval: crates.io has no staging of its own.
    environment: release
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: unpublished
        name: The crates whose version is not on crates.io yet
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          packages=""
          for crate in $(node scripts/release.ts crates); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "ferrovue release workflow (github.com/Kinsmir/ferrovue)" "https://crates.io/api/v1/crates/$crate/$VERSION")
            if [[ "$status" == 200 ]]; then
              echo "$crate@$VERSION is already on crates.io"
            else
              packages="$packages -p $crate"
            fi
          done
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.unpublished.outputs.packages != ''
        id: auth
      # One `cargo publish` for them all: it publishes each crate after those it depends on, and waits
      # for crates.io to serve one before publishing the next.
      - name: Publish them
        if: steps.unpublished.outputs.packages != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PACKAGES: ${{ steps.unpublished.outputs.packages }}
        run: cargo publish $PACKAGES --locked

  github:
    name: GitHub release
    needs: [verify, npm, crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build every package to attach
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          crates=$(node scripts/release.ts crates)
          cargo package $(printf -- '-p %s ' $crates) --locked --no-verify
          for crate in $crates; do echo "target/package/$crate-$VERSION.crate"; done > "$RUNNER_TEMP/crates.txt"
          (cd packages/ferrovue && pnpm pack --pack-destination "$RUNNER_TEMP")
          node scripts/release.ts notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Create the release, unless it exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "the release $GITHUB_REF_NAME exists"
            exit 0
          fi
          mapfile -t crates < "$RUNNER_TEMP/crates.txt"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "ferrovue $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" $([[ "$PRERELEASE" == true ]] && echo --prerelease) \
            "${crates[@]}" "$RUNNER_TEMP/ferrovue-$VERSION.tgz"
      - name: Remind of the npm approval
        if: needs.npm.outputs.approve != ''
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          APPROVE: ${{ needs.npm.outputs.approve }}
        run: |
          echo "::notice title=One step left: approve ferrovue@$VERSION on npm::$APPROVE"
          {
            echo "### One step left: approve ferrovue@$VERSION on npm"
            echo
            echo "The crates and the GitHub release are out; the npm package waits, staged, for 2FA:"
            echo
            echo '```sh'
            echo "$APPROVE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
