name: Mutants

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: Mutants (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          cache-key: mutants
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-mutants
      - name: Run cargo-mutants on this shard
        run: |
          cargo mutants -p ferrovue-core -p ferrovue-router -p ferrovue-i18n -p ferrovue --in-place --shard ${{ matrix.shard }}/4 || status=$?
          if [[ "${status:-0}" != 0 && "${status:-0}" != 2 && "${status:-0}" != 3 ]]; then exit "$status"; fi
      - name: Every surviving mutant is a known equivalent
        run: |
          sed -E 's/^([^:]+):[0-9]+:[0-9]+: /\1: /' mutants.out/missed.txt | sort > "$RUNNER_TEMP/missed.txt"
          grep -v -e '^#' -e '^$' .cargo/mutants-equivalent.txt | sort > "$RUNNER_TEMP/known.txt"
          comm -23 "$RUNNER_TEMP/missed.txt" "$RUNNER_TEMP/known.txt" > "$RUNNER_TEMP/unexplained.txt"
          {
            echo "### Mutants, shard ${{ matrix.shard }}/4"
            echo
            echo "| Caught | Timed out | Missed (known equivalent) | Missed (unexplained) | Unviable |"
            echo "|---:|---:|---:|---:|---:|"
            echo "| $(wc -l < mutants.out/caught.txt) | $(wc -l < mutants.out/timeout.txt) | $(( $(wc -l < mutants.out/missed.txt) - $(wc -l < "$RUNNER_TEMP/unexplained.txt") )) | $(wc -l < "$RUNNER_TEMP/unexplained.txt") | $(wc -l < mutants.out/unviable.txt) |"
            if [[ -s "$RUNNER_TEMP/unexplained.txt" ]]; then
              echo
              echo "Survivors with no test and no explanation:"
              echo
              echo '```text'
              cat "$RUNNER_TEMP/unexplained.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -s "$RUNNER_TEMP/unexplained.txt" ]]; then
            cat "$RUNNER_TEMP/unexplained.txt"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-${{ matrix.shard }}
          path: mutants.out/
          if-no-files-found: warn

  equivalents:
    name: Every listed equivalent still survives
    needs: mutants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutants-*
          path: ${{ runner.temp }}/shards
      - name: No entry of .cargo/mutants-equivalent.txt is stale
        run: |
          cat "$RUNNER_TEMP"/shards/*/missed.txt | sed -E 's/^([^:]+):[0-9]+:[0-9]+: /\1: /' | sort > "$RUNNER_TEMP/missed.txt"
          grep -v -e '^#' -e '^$' .cargo/mutants-equivalent.txt | sort > "$RUNNER_TEMP/known.txt"
          comm -13 "$RUNNER_TEMP/missed.txt" "$RUNNER_TEMP/known.txt" > "$RUNNER_TEMP/stale.txt"
          if [[ -s "$RUNNER_TEMP/stale.txt" ]]; then
            echo "Listed as equivalent, but no shard missed them: remove them from .cargo/mutants-equivalent.txt"
            cat "$RUNNER_TEMP/stale.txt"
            exit 1
          fi
