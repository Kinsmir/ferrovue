name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22.18 is the floor packages/ferrovue/package.json's engines allow.
        node: ["22.18", 22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: The conformance suite's generated Rust is current
        run: pnpm conformance:check
      - name: The example's generated Rust is current
        run: node scripts/ferrovue-in.ts examples/greeting --check
      - name: The Dioxus example's generated Rust is current
        run: node scripts/ferrovue-in.ts examples/dioxus --check
      - name: The contract test's generated Rust is current
        run: node scripts/ferrovue-in.ts crates/ferrovue-contract --check

  typescript-os:
    name: TypeScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      - run: pnpm test
      - name: The conformance suite's generated Rust is current
        run: pnpm conformance:check
      - name: The example's generated Rust is current
        run: node scripts/ferrovue-in.ts examples/greeting --check
      - name: The Dioxus example's generated Rust is current
        run: node scripts/ferrovue-in.ts examples/dioxus --check
      - name: The contract test's generated Rust is current
        run: node scripts/ferrovue-in.ts crates/ferrovue-contract --check

  lint:
    name: Lint (oxlint, fallow)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm lint
      - name: Both workspaces list every member by its path, without wildcards
        run: node scripts/release.ts members

  deny:
    name: Dependencies (cargo-deny ${{ matrix.checks }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        continue-on-error: ${{ matrix.checks == 'advisories' && !startsWith(github.ref, 'refs/tags/') }}
        with:
          command: check ${{ matrix.checks }}
          rust-version: stable

  audit:
    name: Dependencies (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: No known advisory reaches the npm package's dependencies or peers
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          pnpm audit --json > "$RUNNER_TEMP/audit.json" || true
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (!report.advisories) {
              console.log(JSON.stringify(report, null, 2));
              console.log("::error title=pnpm audit::pnpm audit returned no advisory report");
              process.exit(1);
            }
            const manifest = JSON.parse(readFileSync("packages/ferrovue/package.json", "utf8"));
            const shipped = new Set(Object.keys({ ...manifest.dependencies, ...manifest.peerDependencies }));
            const reachesPackage = (path) => {
              const [importer, dependency] = path.split(">");
              return importer === "packages__ferrovue" && shipped.has(dependency);
            };
            const advisories = Object.values(report.advisories)
              .map((advisory) => {
                const paths = [...new Set(advisory.findings.flatMap((finding) => finding.paths))];
                return { ...advisory, paths, published: paths.some(reachesPackage) };
              })
              .toSorted((a, b) => b.published - a.published);
            const command = (text) => text.replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A");
            const cell = (text) => String(text).replaceAll("|", "\\|").replaceAll("\n", " ");
            const lines = ["### npm advisories (pnpm audit)", ""];
            if (advisories.length === 0) {
              lines.push("No known advisories in pnpm-lock.yaml.");
            } else {
              lines.push("| Advisory | Severity | Package | Patched in | Reaches | Paths |", "|---|---|---|---|---|---|");
            }
            for (const advisory of advisories) {
              const versions = [...new Set(advisory.findings.map((finding) => finding.version))].join(", ");
              const shown = advisory.paths.slice(0, 5).join("<br>") + (advisory.paths.length > 5 ? `<br>and ${advisory.paths.length - 5} more` : "");
              const reach = advisory.published ? "the npm package" : "development only";
              lines.push(`| [${cell(advisory.github_advisory_id)}](${advisory.url}): ${cell(advisory.title)} | ${cell(advisory.severity)} | ${cell(advisory.module_name)} ${cell(versions)} | ${cell(advisory.patched_versions)} | ${reach} | ${cell(shown)} |`);
              const level = advisory.published ? "error" : "warning";
              const title = advisory.published ? "Advisory in the npm package" : "Advisory in development tooling";
              console.log(`::${level} title=${title}::${command(`${advisory.github_advisory_id} (${advisory.severity}) in ${advisory.module_name} ${versions}: ${advisory.title}. ${advisory.url}`)}`);
            }
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            if (advisories.some((advisory) => advisory.published)) process.exit(1);
          ' "$RUNNER_TEMP/audit.json"

  zizmor:
    name: Workflows (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          min-severity: medium
          advanced-security: false
          annotations: true

  rust:
    name: Rust (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # msrv: the rust-version in Cargo.toml's [workspace.package].
        toolchain: [stable, msrv]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The minimum supported Rust version, from Cargo.toml
        id: msrv
        if: matrix.toolchain == 'msrv'
        run: |
          version=$(sed -n 's/^rust-version = "\([0-9.]*\)"$/\1/p' Cargo.toml)
          if [[ -z "$version" ]]; then echo "::error title=No rust-version::Cargo.toml has no rust-version = \"x.y\" line"; exit 1; fi
          echo "rust-version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/rust
        with:
          toolchain: ${{ steps.msrv.outputs.version || matrix.toolchain }}
          components: clippy, rustfmt
          cache-key: rust
      - run: cargo test --workspace --all-features --locked
      - name: Each runtime crate's tests, on their own
        run: for crate in ferrovue-core ferrovue-router ferrovue-i18n; do cargo test -p "$crate" --locked; done
      - run: cargo test -p ferrovue --no-default-features --locked
      - name: Without its default features, ferrovue depends on neither the router nor the i18n crate
        run: |
          cargo tree -p ferrovue --no-default-features --edges normal --prefix none --locked | tee "$RUNNER_TEMP/tree.txt"
          if grep -E '^ferrovue-(router|i18n) ' "$RUNNER_TEMP/tree.txt"; then exit 1; fi
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        if: matrix.toolchain == 'stable'
      - run: cargo fmt --all --check
        if: matrix.toolchain == 'stable'
      - run: cargo doc --workspace --no-deps --all-features --locked
        if: matrix.toolchain == 'stable'
        env:
          RUSTDOCFLAGS: -D warnings

  docs-rs:
    name: Docs build as docs.rs builds them (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          toolchain: nightly
          cache-key: docs-rs
      # [package.metadata.docs.rs]: all-features, rustdoc-args = ["--cfg", "docsrs"]. Nightly can
      # break on its own, so only a release tag fails on it.
      - name: cargo +nightly doc, with --cfg docsrs
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  examples:
    name: Example renders
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: examples
      - name: The example builds outside a test build, and renders its page
        run: cargo run -p ferrovue-example-greeting --locked | grep -q 'data-island="Greeting"'
      - name: The Dioxus example renders its page, with the island in it
        run: cargo run -p ferrovue-example-dioxus --locked | grep -q 'data-island="Counter"'

  fullstack:
    name: Full-stack example hydrates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: fullstack
      - uses: ./.github/actions/pnpm
      - name: Build ferrovue, which the example imports as a package (ferrovue/vite, ferrovue/client)
        run: pnpm --filter ferrovue build
      - name: The example's generated Rust is current
        run: pnpm --filter ferrovue-example-fullstack check
      - run: pnpm --filter ferrovue-example-fullstack typecheck
      - name: Build the client, which regenerates the Rust renderers
        run: pnpm --filter ferrovue-example-fullstack build
      - name: The build left the generated Rust as committed
        run: git diff --exit-code -- examples/fullstack/src/generated
      - run: cargo build -p ferrovue-example-fullstack --locked
      - run: cargo test -p ferrovue-example-fullstack --locked
      - name: The server's pages hydrate in the client with no mismatch
        run: pnpm --filter ferrovue-example-fullstack test
      - name: The server streams a page and serves the client's assets
        run: |
          PORT=3917 target/debug/ferrovue-example-fullstack &
          trap 'kill $!' EXIT
          for _ in $(seq 50); do curl -sf -o /dev/null http://127.0.0.1:3917/ && break; sleep 0.2; done
          curl -sf http://127.0.0.1:3917/books/dune > "$RUNNER_TEMP/dune.html"
          grep -q 'data-island="Reviews"' "$RUNNER_TEMP/dune.html"
          script=$(grep -o '/assets/main-[^"]*\.js' "$RUNNER_TEMP/dune.html")
          curl -sf -o /dev/null "http://127.0.0.1:3917$script"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3917/books/missing)" = 404

  browser:
    name: Hydrates in real browsers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: browser
      - uses: ./.github/actions/pnpm
      - name: The Playwright version, whose browsers to fetch
        id: playwright
        working-directory: packages/ferrovue
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Chromium, Firefox and WebKit, with the system libraries they need
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter ferrovue exec playwright install --with-deps chromium firefox webkit
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.browsers.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      - name: The system libraries the cached browsers need
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter ferrovue exec playwright install-deps chromium firefox webkit
      - name: Every conformance fixture, and the full-stack example's pages, hydrate in each browser
        run: pnpm test:browser

  package:
    name: Packages publish cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: package
      - uses: ./.github/actions/pnpm
      - name: The crates package and build from their own tarballs
        run: cargo package -p ferrovue-core -p ferrovue-router -p ferrovue-i18n -p ferrovue --locked
      - name: The npm package packs, with its build, README and licences
        working-directory: packages/ferrovue
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          tar -tzf "$RUNNER_TEMP"/ferrovue-*.tgz | tee "$RUNNER_TEMP/files.txt"
          for f in package/dist/cli.js package/dist/compiler.js package/dist/compiler.d.ts package/README.md package/LICENSE-MIT package/LICENSE-APACHE; do
            grep -qx "$f" "$RUNNER_TEMP/files.txt" || { echo "missing from the npm package: $f"; exit 1; }
          done
          if tar -xzOf "$RUNNER_TEMP"/ferrovue-*.tgz package/package.json | grep -E '"(catalog|workspace):'; then
            echo "the packed package.json still names a pnpm protocol, which npm cannot install"
            exit 1
          fi
      - name: The packed command runs from node_modules
        run: |
          mkdir -p "$RUNNER_TEMP/consumer/components" && cd "$RUNNER_TEMP/consumer"
          echo '{"name":"consumer","private":true,"type":"module"}' > package.json
          echo '{"components":"components","out":"gen"}' > ferrovue.config.json
          cp "$GITHUB_WORKSPACE/examples/greeting/components/Greeting.vue" components/
          vue=$(cd "$GITHUB_WORKSPACE/packages/ferrovue" && node -p 'require("vue/package.json").version')
          npm install --no-audit --no-fund "$RUNNER_TEMP"/ferrovue-*.tgz "vue@$vue"
          npx ferrovue
          test -f gen/greeting.rs

  bench:
    name: Benchmarks run (quick)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: bench
      - uses: ./.github/actions/pnpm
      - name: ferrovue's generated renderers (criterion)
        run: cargo bench -p ferrovue --bench render --locked -- --warm-up-time 1 --measurement-time 2
      - name: Vue's renderToString (tinybench)
        run: pnpm bench:js
        env:
          FERROVUE_BENCH_QUICK: "1"

  passed:
    name: CI passed
    if: always()
    needs: [typescript, typescript-os, lint, deny, audit, zizmor, rust, docs-rs, examples, fullstack, browser, package, bench]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do [[ "$result" == success ]] || exit 1; done
