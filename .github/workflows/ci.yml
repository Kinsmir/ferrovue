name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "7 2 * * 6"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wide: ${{ steps.paths.outputs.wide }}
      node: ${{ steps.paths.outputs.node }}
      ts: ${{ steps.paths.outputs.ts }}
      rust: ${{ steps.paths.outputs.rust }}
      lint: ${{ steps.paths.outputs.lint }}
      package: ${{ steps.paths.outputs.package }}
      platform: ${{ steps.paths.outputs.platform }}
      perf: ${{ steps.paths.outputs.perf }}
      docs: ${{ steps.paths.outputs.docs }}
      hydration: ${{ steps.paths.outputs.hydration }}
      deps: ${{ steps.paths.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          flags=(ts rust lint package platform perf docs hydration deps)
          declare -A on=()
          all() { for flag in "${flags[@]}"; do on[$flag]=1; done; }
          wide=false
          base=
          case "$EVENT" in
            pull_request) base=$PR_BASE; [[ "$HEAD_REF" == release/* ]] && wide=true && all ;;
            push) wide=true; base=$PUSH_BEFORE; [[ "$base" =~ ^0+$ ]] && all ;;
            *) wide=true; all ;;
          esac
          if [[ -n "$base" && ${#on[@]} -eq 0 ]]; then
            while IFS= read -r path; do
              case "$path" in
                .github/workflows/ci.yml | .github/actions/*) all ;;
                .github/* | crates/*/src/* | crates/*/benches/* | fuzz/* | .cargo/* | deny.toml | rust-toolchain.toml) ;;
                *) on[ts]=1 ;;
              esac
              case "$path" in
                crates/* | examples/* | fuzz/* | Cargo.toml | Cargo.lock | rust-toolchain.toml | .cargo/*) on[rust]=1 ;;
              esac
              case "$path" in
                packages/* | scripts/* | site/* | *.ts | *.json | *.jsonc | pnpm-*.yaml | Cargo.toml | crates/*/Cargo.toml | examples/*/Cargo.toml) on[lint]=1 ;;
              esac
              case "$path" in
                packages/ferrovue/* | crates/*/src/* | crates/*/Cargo.toml | Cargo.toml | Cargo.lock | pnpm-lock.yaml | README.md | LICENSE-*) on[package]=1 ;;
              esac
              case "$path" in
                packages/ferrovue/src/* | packages/ferrovue/package.json | scripts/* | pnpm-lock.yaml | pnpm-workspace.yaml | package.json | .node-version) on[platform]=1 ;;
              esac
              case "$path" in
                packages/ferrovue/src/* | packages/ferrovue/bench/* | crates/*/src/* | crates/ferrovue/benches/* | scripts/instructions.ts | scripts/build-budget.ts | Cargo.lock) on[perf]=1 ;;
              esac
              case "$path" in
                crates/*/src/* | crates/ferrovue/docs/* | crates/*/Cargo.toml | Cargo.toml) on[docs]=1 ;;
              esac
              case "$path" in
                packages/ferrovue/src/* | packages/ferrovue/browser/* | crates/ferrovue/tests/conformance/* | crates/*/src/* | examples/fullstack/* | pnpm-lock.yaml | pnpm-workspace.yaml | packages/ferrovue/package.json) on[hydration]=1 ;;
              esac
              case "$path" in
                */Cargo.toml | Cargo.toml | Cargo.lock | fuzz/Cargo.lock | */package.json | package.json | pnpm-lock.yaml | pnpm-workspace.yaml | patches/* | deny.toml | fuzz/deny.toml) on[deps]=1 ;;
              esac
            done < <(git diff --name-only "$base" HEAD)
          fi
          if [[ "$wide" == true ]]; then node='["22.23.4", 22, 24, 26]'; else node='["22.23.4", 26]'; fi
          {
            echo "wide=$wide"
            echo "node=$node"
            for flag in "${flags[@]}"; do
              if [[ -n "${on[$flag]:-}" ]]; then echo "$flag=true"; else echo "$flag=false"; fi
            done
          } | tee -a "$GITHUB_OUTPUT"

  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.changes.outputs.node) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/pnpm
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: The npm package's API report and CLI help are current
        run: pnpm api:check
      - name: The conformance suite's generated Rust is current
        run: pnpm conformance:check
      - name: The example's generated Rust is current
        run: node scripts/ferrovue-in.ts examples/greeting --check
      - name: The Dioxus example's generated Rust is current
        run: node scripts/ferrovue-in.ts examples/dioxus --check
      - name: The contract test's generated Rust is current
        run: node scripts/ferrovue-in.ts crates/ferrovue-contract --check

  typescript-os:
    name: TypeScript (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.platform == 'true' || (needs.changes.outputs.wide == 'true' && needs.changes.outputs.ts == 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/pnpm
      - run: pnpm test
      - name: The conformance suite's generated Rust is current
        run: pnpm conformance:check
      - name: The example's generated Rust is current
        run: node scripts/ferrovue-in.ts examples/greeting --check
      - name: The Dioxus example's generated Rust is current
        run: node scripts/ferrovue-in.ts examples/dioxus --check
      - name: The contract test's generated Rust is current
        run: node scripts/ferrovue-in.ts crates/ferrovue-contract --check

  checks:
    name: Checks
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Workflows (zizmor)
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.30.1
          min-severity: low
          advanced-security: false
          annotations: true
      - id: pnpm
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (needs.changes.outputs.lint == 'true' || needs.changes.outputs.deps == 'true') }}
        uses: $/.github/actions/pnpm
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint (oxlint, fallow)
        id: lint
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' && needs.changes.outputs.lint == 'true' }}
        run: pnpm lint
      - name: Both workspaces list every member by its path, without wildcards
        if: ${{ !cancelled() && steps.lint.conclusion == 'success' && needs.changes.outputs.lint == 'true' }}
        run: node scripts/release.ts members
      - id: deny
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && needs.changes.outputs.deps == 'true' }}
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - name: Dependencies (cargo-deny bans licenses sources)
        id: deny-bans
        if: ${{ !cancelled() && steps.deny.outcome == 'success' && needs.changes.outputs.deps == 'true' }}
        run: cargo deny check bans licenses sources
      - name: Dependencies of the fuzz workspace (cargo-deny bans licenses sources)
        if: ${{ !cancelled() && steps.deny-bans.conclusion == 'success' && needs.changes.outputs.deps == 'true' }}
        run: cargo deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml check bans licenses sources
      - name: Dependencies (cargo-deny advisories)
        id: deny-advisories
        if: ${{ !cancelled() && steps.deny.outcome == 'success' && needs.changes.outputs.deps == 'true' }}
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: cargo deny check advisories
      - name: Dependencies of the fuzz workspace (cargo-deny advisories)
        if: ${{ !cancelled() && steps.deny-advisories.conclusion == 'success' && needs.changes.outputs.deps == 'true' }}
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: cargo deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml check advisories
      - name: "Dependencies (pnpm audit): no known advisory reaches the npm package's dependencies or peers"
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' && needs.changes.outputs.deps == 'true' }}
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          pnpm audit --json > "$RUNNER_TEMP/audit.json" || true
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (!report.advisories) {
              console.log(JSON.stringify(report, null, 2));
              console.log("::error title=pnpm audit::pnpm audit returned no advisory report");
              process.exit(1);
            }
            const manifest = JSON.parse(readFileSync("packages/ferrovue/package.json", "utf8"));
            const shipped = new Set(Object.keys({ ...manifest.dependencies, ...manifest.peerDependencies }));
            const reachesPackage = (path) => {
              const [importer, dependency] = path.split(">");
              return importer === "packages__ferrovue" && shipped.has(dependency);
            };
            const advisories = Object.values(report.advisories)
              .map((advisory) => {
                const paths = [...new Set(advisory.findings.flatMap((finding) => finding.paths))];
                return { ...advisory, paths, published: paths.some(reachesPackage) };
              })
              .toSorted((a, b) => b.published - a.published);
            const command = (text) => text.replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A");
            const cell = (text) => String(text).replaceAll("|", "\\|").replaceAll("\n", " ");
            const lines = ["### npm advisories (pnpm audit)", ""];
            if (advisories.length === 0) {
              lines.push("No known advisories in pnpm-lock.yaml.");
            } else {
              lines.push("| Advisory | Severity | Package | Patched in | Reaches | Paths |", "|---|---|---|---|---|---|");
            }
            for (const advisory of advisories) {
              const versions = [...new Set(advisory.findings.map((finding) => finding.version))].join(", ");
              const shown = advisory.paths.slice(0, 5).join("<br>") + (advisory.paths.length > 5 ? `<br>and ${advisory.paths.length - 5} more` : "");
              const reach = advisory.published ? "the npm package" : "development only";
              lines.push(`| [${cell(advisory.github_advisory_id)}](${advisory.url}): ${cell(advisory.title)} | ${cell(advisory.severity)} | ${cell(advisory.module_name)} ${cell(versions)} | ${cell(advisory.patched_versions)} | ${reach} | ${cell(shown)} |`);
              const level = advisory.published ? "error" : "warning";
              const title = advisory.published ? "Advisory in the npm package" : "Advisory in development tooling";
              console.log(`::${level} title=${title}::${command(`${advisory.github_advisory_id} (${advisory.severity}) in ${advisory.module_name} ${versions}: ${advisory.title}. ${advisory.url}`)}`);
            }
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            if (advisories.some((advisory) => advisory.published)) process.exit(1);
          ' "$RUNNER_TEMP/audit.json"

  rust:
    name: Rust (${{ matrix.toolchain }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, msrv]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The minimum supported Rust version, from Cargo.toml
        id: msrv
        if: matrix.toolchain == 'msrv'
        run: |
          version=$(sed -n 's/^rust-version = "\([0-9.]*\)"$/\1/p' Cargo.toml)
          if [[ -z "$version" ]]; then echo "::error title=No rust-version::Cargo.toml has no rust-version = \"x.y\" line"; exit 1; fi
          echo "rust-version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: $/.github/actions/rust
        with:
          toolchain: ${{ steps.msrv.outputs.version || matrix.toolchain }}
          components: clippy, rustfmt
          cache-key: rust
      - name: The workspace's tests, and on the minimum supported Rust all but those that compare rustc's messages
        run: |
          skip=()
          if [[ "$TOOLCHAIN" == msrv ]]; then skip=(--skip an_enum_missing_a_variant); fi
          cargo test --workspace --all-features --locked -- "${skip[@]}"
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
      - name: Each runtime crate's tests, on their own
        run: for crate in ferrovue-core ferrovue-router ferrovue-i18n; do cargo test -p "$crate" --locked; done
      - run: cargo test -p ferrovue --no-default-features --locked
      - name: Without its default features, ferrovue depends on neither the router nor the i18n crate
        run: |
          cargo tree -p ferrovue --no-default-features --edges normal --prefix none --locked | tee "$RUNNER_TEMP/tree.txt"
          if grep -E '^ferrovue-(router|i18n) ' "$RUNNER_TEMP/tree.txt"; then exit 1; fi
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        if: matrix.toolchain == 'stable'
      - run: cargo fmt --all --check
        if: matrix.toolchain == 'stable'
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
        if: matrix.toolchain == 'stable'
      - run: cargo doc --workspace --no-deps --all-features --locked
        if: matrix.toolchain == 'stable'
        env:
          RUSTDOCFLAGS: -D warnings

  docs-rs:
    name: Docs build as docs.rs builds them (nightly)
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust
        with:
          toolchain: nightly
          cache-key: docs-rs
      - name: cargo +nightly doc, with --cfg docsrs
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  examples:
    name: Examples and package
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.hydration == 'true' || needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: rust
        uses: $/.github/actions/rust
        with:
          cache-key: examples
      - id: pnpm
        if: needs.changes.outputs.hydration == 'true' || needs.changes.outputs.package == 'true'
        uses: $/.github/actions/pnpm
      - name: The example builds outside a test build, and renders its page
        id: greeting
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && needs.changes.outputs.rust == 'true' }}
        run: cargo run -p ferrovue-example-greeting --locked | grep -q 'data-island="Greeting"'
      - name: The Dioxus example renders its page, with the island in it
        if: ${{ !cancelled() && steps.greeting.conclusion == 'success' && needs.changes.outputs.rust == 'true' }}
        run: cargo run -p ferrovue-example-dioxus --locked | grep -q 'data-island="Counter"'
      - name: Build ferrovue, which the example imports as a package (ferrovue/vite, ferrovue/client)
        id: fullstack-ferrovue
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' && needs.changes.outputs.hydration == 'true' }}
        run: pnpm --filter ferrovue build
      - name: The full-stack example's generated Rust is current
        id: fullstack-current
        if: ${{ !cancelled() && steps.fullstack-ferrovue.conclusion == 'success' && needs.changes.outputs.hydration == 'true' }}
        run: pnpm --filter ferrovue-example-fullstack check
      - id: fullstack-typecheck
        if: ${{ !cancelled() && steps.fullstack-current.conclusion == 'success' && needs.changes.outputs.hydration == 'true' }}
        run: pnpm --filter ferrovue-example-fullstack typecheck
      - name: Build the client, which regenerates the Rust renderers
        id: fullstack-client
        if: ${{ !cancelled() && steps.fullstack-typecheck.conclusion == 'success' && needs.changes.outputs.hydration == 'true' }}
        run: pnpm --filter ferrovue-example-fullstack build
      - name: The build left the generated Rust as committed
        id: fullstack-committed
        if: ${{ !cancelled() && steps.fullstack-client.conclusion == 'success' && needs.changes.outputs.hydration == 'true' }}
        run: git diff --exit-code -- examples/fullstack/src/generated
      - id: fullstack-build
        if: ${{ !cancelled() && steps.fullstack-committed.conclusion == 'success' && needs.changes.outputs.hydration == 'true' }}
        run: cargo build -p ferrovue-example-fullstack --locked
      - id: fullstack-test
        if: ${{ !cancelled() && steps.fullstack-build.conclusion == 'success' && needs.changes.outputs.hydration == 'true' }}
        run: cargo test -p ferrovue-example-fullstack --locked
      - name: The server's pages hydrate in the client with no mismatch
        id: fullstack-hydrates
        if: ${{ !cancelled() && steps.fullstack-test.conclusion == 'success' && needs.changes.outputs.hydration == 'true' }}
        run: pnpm --filter ferrovue-example-fullstack test
      - name: The server streams a page and serves the client's assets
        if: ${{ !cancelled() && steps.fullstack-hydrates.conclusion == 'success' && needs.changes.outputs.hydration == 'true' }}
        run: |
          PORT=3917 target/debug/ferrovue-example-fullstack &
          trap 'kill $!' EXIT
          for _ in $(seq 50); do curl -sf -o /dev/null http://127.0.0.1:3917/ && break; sleep 0.2; done
          curl -sf http://127.0.0.1:3917/books/dune > "$RUNNER_TEMP/dune.html"
          grep -q 'data-island="Reviews"' "$RUNNER_TEMP/dune.html"
          script=$(grep -o '/assets/main-[^"]*\.js' "$RUNNER_TEMP/dune.html")
          curl -sf -o /dev/null "http://127.0.0.1:3917$script"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3917/books/missing)" = 404
      - name: The crates package and build from their own tarballs
        id: crates
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' && needs.changes.outputs.package == 'true' }}
        run: cargo package -p ferrovue-core -p ferrovue-router -p ferrovue-i18n -p ferrovue --locked
      - name: The npm package packs, with its build, README and licences
        id: npm-pack
        if: ${{ !cancelled() && steps.crates.conclusion == 'success' && needs.changes.outputs.package == 'true' }}
        working-directory: packages/ferrovue
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          tar -tzf "$RUNNER_TEMP"/ferrovue-*.tgz | tee "$RUNNER_TEMP/files.txt"
          for f in package/dist/cli.js package/dist/compiler.js package/dist/compiler.d.ts package/README.md package/LICENSE-MIT package/LICENSE-APACHE; do
            grep -qx "$f" "$RUNNER_TEMP/files.txt" || { echo "missing from the npm package: $f"; exit 1; }
          done
          if tar -xzOf "$RUNNER_TEMP"/ferrovue-*.tgz package/package.json | grep -E '"(catalog|workspace):'; then
            echo "the packed package.json still names a pnpm protocol, which npm cannot install"
            exit 1
          fi
      - name: The packed command runs from node_modules
        if: ${{ !cancelled() && steps.npm-pack.conclusion == 'success' && needs.changes.outputs.package == 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/consumer/components" && cd "$RUNNER_TEMP/consumer"
          echo '{"name":"consumer","private":true,"type":"module"}' > package.json
          echo '{"components":"components","out":"gen"}' > ferrovue.config.json
          cp "$GITHUB_WORKSPACE/examples/greeting/components/Greeting.vue" components/
          vue=$(cd "$GITHUB_WORKSPACE/packages/ferrovue" && node -p 'require("vue/package.json").version')
          npm install --no-audit --no-fund "$RUNNER_TEMP"/ferrovue-*.tgz "vue@$vue"
          npx ferrovue
          test -f gen/greeting.rs

  browser:
    name: Hydrates in real browsers
    needs: changes
    if: needs.changes.outputs.hydration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust
        with:
          cache-key: browser
      - uses: $/.github/actions/pnpm
      - name: The Playwright version, whose browsers to fetch
        id: playwright
        working-directory: packages/ferrovue
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - uses: $/.github/actions/apt-mirror
      - name: Chromium, Firefox and WebKit, with the system libraries they need
        if: steps.browsers.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            timeout 6m pnpm --filter ferrovue exec playwright install --with-deps chromium firefox webkit && exit 0
            sudo pkill -x apt-get || true
            while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock >/dev/null 2>&1; do sleep 2; done
            sudo dpkg --configure -a || true
          done
          exit 1
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.browsers.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      - name: The system libraries the cached browsers need
        if: steps.browsers.outputs.cache-hit == 'true'
        run: |
          for attempt in 1 2 3; do
            timeout 6m pnpm --filter ferrovue exec playwright install-deps chromium firefox webkit && exit 0
            sudo pkill -x apt-get || true
            while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock >/dev/null 2>&1; do sleep 2; done
            sudo dpkg --configure -a || true
          done
          exit 1
      - name: Every conformance fixture, and the full-stack example's pages, hydrate in each browser
        run: pnpm test:browser

  perf:
    name: Performance budgets
    needs: changes
    if: needs.changes.outputs.perf == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust
        with:
          cache-key: perf
      - id: pnpm
        uses: $/.github/actions/pnpm
      - name: ferrovue's generated renderers (criterion)
        id: criterion
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
        run: cargo bench -p ferrovue --bench render --locked -- --warm-up-time 1 --measurement-time 2
      - name: Vue's renderToString (tinybench)
        if: ${{ !cancelled() && steps.criterion.conclusion == 'success' }}
        run: pnpm bench:js
        env:
          FERROVUE_BENCH_QUICK: "1"
      - name: The toolchain and gungraun version the baseline was measured with
        id: baseline
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
        run: |
          echo "toolchain=$(node scripts/instructions.ts --print toolchain)" >> "$GITHUB_OUTPUT"
          echo "runner=$(node scripts/instructions.ts --print runner-version)" >> "$GITHUB_OUTPUT"
      - id: apt-mirror
        if: ${{ !cancelled() && steps.baseline.conclusion == 'success' }}
        uses: $/.github/actions/apt-mirror
      - name: That toolchain with the musl target, Valgrind and gungraun-runner
        id: valgrind
        if: ${{ !cancelled() && steps.apt-mirror.conclusion == 'success' }}
        env:
          TOOLCHAIN: ${{ steps.baseline.outputs.toolchain }}
          RUNNER: ${{ steps.baseline.outputs.runner }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --target x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind
          cargo install gungraun-runner --version "$RUNNER" --locked
      - name: Each scenario within 5% of crates/ferrovue/benches/instructions.json
        if: ${{ !cancelled() && steps.valgrind.conclusion == 'success' }}
        run: node scripts/instructions.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: instructions
          path: target/instructions/instructions.json
          if-no-files-found: warn
      - name: The compiler and cargo build of the generated modules within their budgets
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
        run: node scripts/build-budget.ts

  passed:
    name: CI passed
    if: always()
    needs: [changes, typescript, typescript-os, checks, rust, docs-rs, examples, browser, perf]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          echo "$RESULTS"
          [[ "$CHANGES" == success ]] || exit 1
          for result in $RESULTS; do [[ "$result" == success || "$result" == skipped ]] || exit 1; done
