rules:
  ref-version-mismatch:
    ignore:
      - action.yml:23
  adhoc-packages:
    ignore:
      # The step that runs the packed command installs the packed tarball with npm, as a user does, which no lockfile describes.
      - ci.yml:417
      # The release pins the npm it publishes with to an exact version.
      - release-dry-run.yml:68
      - release.yml:101
