packages:
  - packages/ferrovue
  - examples/fullstack

# One version for what more than one package.json uses; `pnpm pack` writes it in place of
# `catalog:`. The peer ranges in packages/ferrovue/package.json stay written out: they are what
# users install against.
catalog:
  vue: "3.5.43"
  "@vue/compiler-sfc": "3.5.43"
  "@vue/server-renderer": "3.5.43"
  "@vue/shared": "3.5.43"
  vue-router: "^5.3.1"
  pinia: "^4.0.3"
  vue-i18n: "11.4.13"
  "@intlify/message-compiler": "11.4.13"
  "@unhead/vue": "^3.4.2"
  "@types/node": "^26.6.4"
  "@vitejs/plugin-vue": "^6.0.9"
  happy-dom: "^20.14.5"
  playwright: "1.63.0"
  typescript: "^7.0.2"
  vite: "^8.3.4"
  vitest: "^5.0.3"
