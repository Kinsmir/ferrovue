# Listed one by one, never by wildcard (`node scripts/release.ts check` fails on one that is missing).
packages:
  - packages/ferrovue
  - examples/fullstack

# esbuild (a Vite dependency) unpacks its platform binary in a postinstall script, which pnpm blocks
# by default; allowed here so CI needs no interactive answer.
allowBuilds:
  esbuild: true
