[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
unused-allowed-license = "allow"
confidence-threshold = 0.9
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
skip = [
    { crate = "convert_case:<0.10", reason = "dioxus 0.7's macros use convert_case 0.8 and derive_more 2 uses 0.10" },
    { crate = "http:<1", reason = "actix-http 3 is built on http 0.2 and the axum stack on http 1" },
    { crate = "syn:<3", reason = "derive and macro crates are moving from syn 2 to syn 3 one at a time" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
