[package]
name = "ferrovue-example-fullstack"
description = "An axum server rendering Vue components compiled by ferrovue, hydrated by a Vite client"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = "0.8.9"
ferrovue = { path = "../../crates/ferrovue" }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[lints]
workspace = true
