[package]
name = "ferrovue-example-fullstack"
description = "An axum server rendering Vue components compiled by ferrovue, hydrated by a Vite client"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = { workspace = true, features = ["form", "http1", "json", "matched-path", "original-uri", "query", "tokio", "tower-log", "tracing"] }
ferrovue = { workspace = true, features = ["axum"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { workspace = true, features = ["fs"] }

[lints]
workspace = true
