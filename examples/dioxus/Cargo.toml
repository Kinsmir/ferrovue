[package]
name = "ferrovue-example-dioxus"
description = "A Dioxus page, rendered with dioxus-ssr, embedding a Vue island compiled by ferrovue"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# `rsx!`, `#[component]` and the HTML elements (whose macros use signals): no launcher or renderer.
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals"] }
dioxus-ssr = { version = "0.7.10", default-features = false }
ferrovue = { path = "../../crates/ferrovue", features = ["dioxus"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.151"

[lints]
workspace = true
