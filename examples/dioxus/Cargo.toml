[package]
name = "ferrovue-example-dioxus"
description = "A Dioxus page, rendered with dioxus-ssr, embedding a Vue island compiled by ferrovue"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
dioxus = { workspace = true, features = ["macro", "html", "signals"] }
dioxus-ssr.workspace = true
ferrovue = { workspace = true, features = ["dioxus"] }
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
