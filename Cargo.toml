[workspace]
members = ["crates/ferrovue", "examples/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# The latest stable Rust; generated renderers also need edition 2024 (let-chains).
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kinsmir/ferrovue"
homepage = "https://github.com/Kinsmir/ferrovue"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"
