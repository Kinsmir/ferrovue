[workspace]
members = [
    "crates/ferrovue-core",
    "crates/ferrovue-router",
    "crates/ferrovue-i18n",
    "crates/ferrovue",
    "examples/greeting",
    "examples/fullstack",
    "examples/dioxus",
]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kinsmir/ferrovue"
homepage = "https://github.com/Kinsmir/ferrovue"

[workspace.dependencies]
ferrovue-core = { path = "crates/ferrovue-core", version = "=0.4.0" }
ferrovue-i18n = { path = "crates/ferrovue-i18n", version = "=0.4.0" }
ferrovue-router = { path = "crates/ferrovue-router", version = "=0.4.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"
