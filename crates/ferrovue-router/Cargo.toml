[package]
name = "ferrovue-router"
description = "vue-router's link resolution and route matching for ferrovue's server-rendered Vue components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ferrovue-router"
readme = "README.md"
keywords = ["vue", "ssr", "router", "vue-router", "routing"]
categories = ["template-engine", "web-programming"]

[dependencies]
ferrovue-core.workspace = true
# `{{ route.query.tag }}` of a repeated key: the values as `JSON.stringify` writes them.
serde_json = "1.0.151"

[dev-dependencies]
proptest = "1"
# The vectors recorded from vue-router (`tests/vectors/`) are read into structs.
serde = { version = "1.0.229", features = ["derive"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
