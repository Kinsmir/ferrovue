[package]
name = "ferrovue"
description = "Vue templates compiled to Rust render functions: server-side rendering with no JavaScript at run time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ferrovue"
readme = "README.md"
keywords = ["vue", "ssr", "html", "templates", "hydration"]
categories = ["template-engine", "web-programming"]

[features]
default = ["router", "i18n"]
router = ["dep:ferrovue-router"]
i18n = ["dep:ferrovue-i18n"]
maud = ["dep:maud"]
stream = ["dep:bytes", "dep:futures-core"]
axum = ["stream", "dep:axum-core", "dep:http"]
actix-web = ["stream", "dep:actix-web"]
dioxus = ["dep:dioxus-core"]

[dependencies]
ferrovue-core.workspace = true
ferrovue-i18n = { workspace = true, optional = true }
ferrovue-router = { workspace = true, optional = true }
actix-web = { version = "4.15.0", default-features = false, optional = true }
axum-core = { version = "0.5.6", optional = true }
bytes = { version = "1.12.1", optional = true }
dioxus-core = { version = "0.7.10", optional = true, default-features = false }
futures-core = { version = "0.3.34", default-features = false, optional = true }
http = { version = "1.5.0", optional = true }
maud = { version = "0.27.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
axum = { version = "0.8.9", default-features = false }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
dioxus-ssr = { version = "0.7.10", default-features = false }
proptest = "1"
tokio = { version = "1.53.2", features = ["macros", "rt", "test-util", "time"] }

[[bench]]
name = "render"
harness = false
required-features = ["router", "i18n"]

[[test]]
name = "conformance"
required-features = ["router", "i18n"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
