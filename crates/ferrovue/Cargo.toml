[package]
name = "ferrovue"
description = "Vue templates compiled to Rust render functions: server-side rendering with no JavaScript at run time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["vue", "ssr", "html", "templates", "hydration"]
categories = ["template-engine", "web-programming"]

[features]
# `impl maud::Render for Html`, so a generated renderer can be spliced into a maud page.
maud = ["dep:maud"]

[dependencies]
maud = { version = "0.27.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
proptest = "1"

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
