[package]
name = "ferrovue"
description = "Vue templates compiled to Rust render functions: server-side rendering with no JavaScript at run time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/ferrovue"
readme = "README.md"
keywords = ["vue", "ssr", "html", "templates", "hydration"]
categories = ["template-engine", "web-programming"]

[features]
default = ["router", "i18n"]
router = ["dep:ferrovue-router"]
i18n = ["dep:ferrovue-i18n"]
maud = ["dep:maud"]
stream = ["dep:bytes", "dep:futures-core"]
axum = ["stream", "dep:axum-core", "dep:http"]
actix-web = ["stream", "dep:actix-web"]
dioxus = ["dep:dioxus-core"]

[dependencies]
ferrovue-core.workspace = true
ferrovue-i18n = { workspace = true, optional = true }
ferrovue-router = { workspace = true, optional = true }
actix-web = { workspace = true, optional = true }
axum-core = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
dioxus-core = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
http = { workspace = true, optional = true }
maud = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
axum.workspace = true
criterion = { workspace = true, features = ["cargo_bench_support"] }
dioxus-ssr.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[[bench]]
name = "render"
harness = false
required-features = ["router", "i18n"]

[[test]]
name = "conformance"
required-features = ["router", "i18n"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
